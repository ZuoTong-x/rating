map $cookie_image_rating_session $api_client_key {
  ""      $binary_remote_addr;
  default $cookie_image_rating_session;
}

limit_req_zone $api_client_key zone=api_per_session:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=1500r/s;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 64m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_req zone=api_per_session burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /files/ {
    proxy_pass http://image-files:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|svg|woff2?|png|jpe?g|webp|gif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
